    <script>

        var clickedElement = event.target;
        var nav = document.getElementById("burgerMenu");
        console.log(
          "closeMenuWhenClickOutside",
          event.target,
        ); /* Loguea dónde se ha hecho el click*/

        console.log(nav.classList.contains("isOpen"));
        console.log(clickedElement !== document.getElementById("navButton"));
        console.log(clickedElement !== document.getElementById("burgerMenu"));
        if (
          nav.classList.contains("isOpen") &&
          !document.getElementById("navButton").contains(clickedElement) &&
          !document.getElementById("burgerMenu").contains(clickedElement)
        ) {
          toggleMenu();
        }
      }
    </script>
