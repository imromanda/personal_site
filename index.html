<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I'm Romanda</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Poppins"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/sections.css" />
  </head>

  <body style="overflow: hidden">
    <nav>
      <ul>
        <li>
          <a
            href="index.html"
            data-i18n="nav_home"
            style="background-color: var(--buff); color: var(--prussian-blue)"
            >Home</a
          >
        </li>

        <li>
          <a href="projects/index.html" data-i18n="nav_projects">Projects</a>
        </li>

        <li>
          <a href="education.html" data-i18n="nav_education">Education</a>
        </li>

        <li>
          <a href="about.html" data-i18n="nav_about">About</a>
        </li>
        <li>
          <button onclick="setLanguage('en')" class="lang-btn">EN</button>
          <button onclick="setLanguage('es')" class="lang-btn">ES</button>
        </li>
      </ul>
    </nav>

    <main
      style="
        display: flex;
        height: 100vh;
        margin-left: auto;
        margin-right: auto;
        padding: 10vw 2vh;
        justify-content: center;
        align-items: center;
        gap: 60px;
      "
    >
      <div>
        <img
          src="assets/Romanda_Selfie.jpg"
          class="profile-pic"
          data-i18n="home_img_alt"
          data-i18n-attr="alt"
          alt="Woman with curly and loose hair, smiling outdoors, with trees and sand in the background, under natural light."
        />
      </div>

      <div style="max-width: 586px">
        <h1 id="salute" style="line-height: 0.5em" data-i18n="greeting_morning">
          Hi there!
        </h1>
        <h1
          style="color: var(--paolo-veronese-green); line-height: 0.5em"
          data-i18n="home_name"
        >
          I'm Romanda
        </h1>
        <h6
          style="margin-top: 20px; margin-bottom: 0; max-width: 80%"
          data-i18n="home_descriptor"
        >
          A multidisciplinary designer with a eye for systems and a love for
          visual communication
        </h6>
        <h6
          style="margin-top: 20px; margin-bottom: 0"
          data-i18n="home_learning"
        >
          Now learning
          <span
            style="
              background-color: color-mix(
                in srgb,
                var(--buff) 30%,
                transparent
              );
            "
          >
            to build what I design
          </span>
        </h6>
        <p style="margin-top: 16px">
          <em data-i18n="home_tagline"
            >Creativity and experimentation as lifestyle</em
          >
        </p>
      </div>
    </main>

    <footer>
      <a href="mailto:imromanda@gmail.com"><i class="bi bi-envelope"></i></a>
      <a href="https://www.linkedin.com/in/ana-romero-romanda/" target="_blank"
        ><i class="bi bi-linkedin"></i
      ></a>
      <a href="https://www.instagram.com/romandaarte/" target="_blank"
        ><i class="bi bi-instagram"></i
      ></a>
      <a href="https://github.com/imromanda" target="_blank"
        ><i class="bi bi-github"></i
      ></a>
    </footer>

    <script src="js/i18n.js"></script>
  </body>
</html>
